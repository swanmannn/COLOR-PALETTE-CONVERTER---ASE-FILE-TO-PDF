<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASE Color Palette Viewer</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; max-width: 800px; margin: 0 auto; }
        #file-title { display: none; font-size: 28px; margin: 0 0 20px 0; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        #drop-zone { width: 300px; height: 100px; border: 2px dashed #ccc; text-align: center; line-height: 100px; margin-bottom: 20px; background: white; border-radius: 8px; }
        #export-btn { display: none; padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
        #export-btn:hover { background-color: #0056b3; }
        #palette { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        .color-card { width: 120px; text-align: center; font-family: monospace; border: 1px solid #ddd; padding: 5px; border-radius: 4px; background: white; }
        .color-block { width: 120px; height: 80px; border-radius: 4px; }
        #text-list-container { display: none; background: white; border: 1px solid #ddd; padding: 15px; border-radius: 4px; position: relative; }
        #text-list-container h3 { margin-top: 0; }
        #copy-btn { padding: 6px 12px; font-size: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        #copy-btn:hover { background-color: #218838; }
        #hex-text-list { font-family: monospace; white-space: pre-line; background: #f4f4f4; padding: 10px; border-radius: 4px; font-size: 14px; }
    </style>
    
    <!-- FIX: Pointers look directly at your local folder file bypassing internet blocks -->
    <script src="jspdf.js"></script>
</head>
<body>

    <h2 id="file-title"></h2>

    <div id="drop-zone">Drag & Drop your .ASE file here</div>
    
    <button id="export-btn">Export as PDF</button>
    
    <div id="palette"></div>

    <div id="text-list-container">
        <h3>Palette Hex Codes</h3>
        <button id="copy-btn">Copy List</button>
        <div id="hex-text-list"></div>
    </div>

    <script src="parser.js"></script>
</body>
</html>
